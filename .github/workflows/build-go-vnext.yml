name: Build Go Edge vNext

on:
  push:
    branches: [main, go-vnext]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Resolve modules
        run: go mod tidy
      - name: Show Go
        run: go version
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

      - name: Build single Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $sha = "${{ github.sha }}"
          go build -trimpath -ldflags "-s -w -X main.version=0.8.0-two-pass -X main.gitSHA=$sha" -o out/plantops-edge-scale.exe ./cmd/edge
          if (-not (Test-Path out/plantops-edge-scale.exe)) { throw 'exe missing' }

      - name: Build CI simulators
        shell: pwsh
        run: |
          go build -trimpath -o out/scale-sim.exe ./.github/testdata/scale-sim.go
          go build -trimpath -o out/modbus-io-sim.exe ./.github/testdata/modbus-io-sim.go
          go build -trimpath -o out/w100-sim.exe ./.github/testdata/w100-sim.go

      - name: Runtime two-pass + SQLite + audit acceptance
        shell: pwsh
        run: |
          $weightPath = Join-Path $PWD 'out/raw-weight-ci.jsonl'
          $eventPath = Join-Path $PWD 'out/events-ci.jsonl'
          $dbPath = Join-Path $PWD 'out/edge-ci.db'
          Remove-Item $weightPath,$eventPath,$dbPath,"$dbPath-wal","$dbPath-shm" -ErrorAction SilentlyContinue

          $scaleSim = Start-Process .\out\scale-sim.exe -PassThru
          Start-Sleep -Milliseconds 600
          $p = Start-Process .\out\plantops-edge-scale.exe -ArgumentList @(
            '-scale-addr','127.0.0.1:19001','-station-id','CI-SCALE-01',
            '-raw-weight-journal',$weightPath,'-event-journal',$eventPath,'-db',$dbPath,
            '-vehicle-map','RFID-DEMO-001=15C-123.45','-empty-scale-max-kg','200',
            '-min-stable-weight-kg','1000','-stable-confirmations','2','-stable-tolerance-kg','20',
            '-pair-max-elapsed','2h','-pair-min-net-kg','1000','-simulation'
          ) -PassThru
          try {
            $ready=$false
            for($i=0;$i -lt 60;$i++){
              try{
                $h=Invoke-RestMethod http://127.0.0.1:8080/healthz -TimeoutSec 1
                $scale=Invoke-RestMethod http://127.0.0.1:8080/api/scale/status -TimeoutSec 1
                $storage=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status -TimeoutSec 1
                if($h.status -eq 'ok' -and $h.two_pass_cycle -and $storage.integrity -eq 'ok' -and [int]$storage.schema_version -eq 2 -and $scale.connected -and $scale.last_reading.stable -and [int64]$scale.last_reading.weight_kg -eq 0){$ready=$true;break}
              }catch{}
              Start-Sleep -Milliseconds 150
            }
            if(-not $ready){throw 'startup/schema2/stable-zero proof failed'}

            # PASS #1: A -> B, gross 28,460 kg. It must QUEUE only.
            $entry=Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"entry_present":true,"safety_clear":true}'
            if($entry.state -ne 'IDENTIFYING' -or $entry.transaction.direction -ne 'A_TO_B' -or [int]$entry.transaction.pass_number -ne 1){throw "pass1 direction/state invalid: $($entry|ConvertTo-Json -Compress)"}
            Invoke-RestMethod http://127.0.0.1:8080/io/rfid -Method Post -ContentType 'application/json' -Body '{"tag":"RFID-DEMO-001","quality":99}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:8080/io/lpr -Method Post -ContentType 'application/json' -Body '{"plate":"15C-123.45","confidence":98}' | Out-Null
            $wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow
            if($wf.state -ne 'ENTRY_AUTHORIZED'){throw 'pass1 identity/entry authorization failed'}
            $positioned=Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"front_present":true,"rear_present":true,"safety_clear":true}'
            if($positioned.transaction.position -ne 'ACCEPTED'){throw 'pass1 position not accepted'}

            $queued=$false
            for($i=0;$i -lt 80;$i++){
              $wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow
              $st=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status
              if($wf.state -eq 'EXIT_AUTHORIZED' -and $wf.transaction.cycle_status -eq 'QUEUED' -and [int64]$st.queued_cycles -eq 1){$queued=$true;break}
              if($wf.state -eq 'FAULT_LOCKOUT'){throw "pass1 lockout: $($wf.transaction.last_block_reason)"}
              Start-Sleep -Milliseconds 150
            }
            if(-not $queued){throw 'pass1 did not become durable QUEUED cycle'}
            if([int64]$wf.transaction.accepted_weight.weight_kg -ne 28460){throw 'pass1 gross mismatch'}
            if($wf.transaction.business_complete -or $wf.transaction.ticket_id){throw 'pass1 illegally became completed business transaction'}
            if([int64]$st.tickets -ne 0 -or [int64]$st.pending_sync -ne 0){throw "pass1 illegally created final ticket/sync: $($st|ConvertTo-Json -Compress)"}

            $queue=Invoke-RestMethod http://127.0.0.1:8080/api/queue
            if([int]$queue.count -ne 1 -or $queue.items[0].status -ne 'QUEUED'){throw 'durable queue missing pass1 cycle'}
            $cycleId=[string]$queue.items[0].id
            if([int64]$queue.items[0].first_pass.weight.weight_kg -ne 28460){throw 'queued first weight mismatch'}

            # Physically finish pass1 and return scale session to IDLE while business cycle survives.
            Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"exit_present":true,"safety_clear":true}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"safety_clear":true}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"safety_clear":true}' | Out-Null
            $wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow
            if($wf.state -ne 'IDLE'){throw "physical pass did not return IDLE: $($wf.state)"}
            $st=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status
            if([int64]$st.queued_cycles -ne 1 -or [int64]$st.tickets -ne 0){throw 'queue did not survive physical pass reset'}

            # CALL exactly the cycle to be paired.
            $called=Invoke-RestMethod "http://127.0.0.1:8080/api/queue/$cycleId/call" -Method Post
            if($called.status -ne 'called'){throw 'cycle call failed'}
            $queue=Invoke-RestMethod http://127.0.0.1:8080/api/queue
            if($queue.items[0].status -ne 'CALLED'){throw 'queue item not CALLED'}

            # Wait for audited empty-deck proof before the return.
            $zero2=$false
            for($i=0;$i -lt 60;$i++){
              $scale=Invoke-RestMethod http://127.0.0.1:8080/api/scale/status
              if($scale.last_reading.stable -and [int64]$scale.last_reading.weight_kg -eq 0){$zero2=$true;break}
              Start-Sleep -Milliseconds 150
            }
            if(-not $zero2){throw 'second empty-deck proof missing'}

            # PASS #2: B -> A. It must bind the CALLED cycle and only then enter.
            $return=Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"exit_present":true,"safety_clear":true}'
            if($return.state -ne 'IDENTIFYING' -or $return.transaction.direction -ne 'B_TO_A' -or [int]$return.transaction.pass_number -ne 2){throw "pass2 direction/state invalid: $($return|ConvertTo-Json -Compress)"}
            Invoke-RestMethod http://127.0.0.1:8080/io/rfid -Method Post -ContentType 'application/json' -Body '{"tag":"RFID-DEMO-001","quality":99}' | Out-Null
            Invoke-RestMethod http://127.0.0.1:8080/io/lpr -Method Post -ContentType 'application/json' -Body '{"plate":"15C-123.45","confidence":98}' | Out-Null
            $wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow
            if($wf.transaction.cycle_id -ne $cycleId -or $wf.transaction.cycle_status -ne 'CALLED'){throw 'pass2 did not bind exact CALLED cycle'}
            if($wf.state -ne 'ENTRY_AUTHORIZED'){throw "pass2 not authorized after call: $($wf.state) $($wf.transaction.last_block_reason)"}
            $positioned=Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"front_present":true,"rear_present":true,"safety_clear":true}'
            if($positioned.transaction.position -ne 'ACCEPTED'){throw 'pass2 position not accepted'}

            $completePair=$false
            for($i=0;$i -lt 90;$i++){
              $wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow
              $st=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status
              if($wf.state -eq 'EXIT_AUTHORIZED' -and $wf.transaction.business_complete -and $wf.transaction.cycle_status -eq 'COMPLETE' -and [int64]$st.completed_cycles -eq 1){$completePair=$true;break}
              if($wf.state -eq 'FAULT_LOCKOUT'){throw "pass2 lockout: $($wf.transaction.last_block_reason)"}
              Start-Sleep -Milliseconds 150
            }
            if(-not $completePair){throw 'second pass did not atomically complete pair'}
            if([int64]$wf.transaction.accepted_weight.weight_kg -ne 11820){throw 'pass2 tare mismatch'}
            if(-not $wf.transaction.ticket_id){throw 'final paired ticket id missing'}
            if([int64]$st.tickets -ne 1 -or [int64]$st.pending_sync -ne 1 -or [int64]$st.queued_cycles -ne 0 -or [int64]$st.called_cycles -ne 0){throw "final atomic state invalid: $($st|ConvertTo-Json -Compress)"}

            $queue=Invoke-RestMethod http://127.0.0.1:8080/api/queue
            if([int]$queue.count -ne 0){throw 'completed cycle remained in active queue'}

            # B->A egress is physical side A (historic entry_present).
            Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"entry_present":true,"safety_clear":true}' | Out-Null
            $done=Invoke-RestMethod http://127.0.0.1:8080/sim/position -Method Post -ContentType 'application/json' -Body '{"safety_clear":true}'
            if($done.state -ne 'COMPLETE'){throw "pass2 physical workflow did not COMPLETE: $($done.state)"}

            $weights=Invoke-RestMethod 'http://127.0.0.1:8080/api/audit/weights?limit=100'
            if([int]$weights.count -lt 8){throw 'two-pass raw weight timeline incomplete'}
            if(-not (Invoke-RestMethod http://127.0.0.1:8080/api/audit/weights/verify).verified){throw 'raw weight hash chain failed'}
            if(-not (Invoke-RestMethod http://127.0.0.1:8080/api/audit/events/verify).verified){throw 'event hash chain failed'}
            Write-Host 'TWO-PASS PASS: 28460 gross -> QUEUED -> CALLED -> 11820 tare -> 16640 net -> COMPLETE'
          } finally {
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force}
            if($scaleSim -and -not $scaleSim.HasExited){Stop-Process -Id $scaleSim.Id -Force}
          }

          # Reopen the same edge.db: completed pair persists, physical workflow boots IDLE.
          $p2=Start-Process .\out\plantops-edge-scale.exe -ArgumentList @('-listen','127.0.0.1:8081','-station-id','CI-SCALE-01','-db',$dbPath,'-raw-weight-journal',$weightPath,'-event-journal',$eventPath) -PassThru
          try{
            $ready=$false
            for($i=0;$i -lt 40;$i++){
              try{
                $s2=Invoke-RestMethod http://127.0.0.1:8081/api/storage/status -TimeoutSec 1
                $wf2=Invoke-RestMethod http://127.0.0.1:8081/api/workflow -TimeoutSec 1
                $q2=Invoke-RestMethod http://127.0.0.1:8081/api/queue -TimeoutSec 1
                if($s2.integrity -eq 'ok' -and [int64]$s2.tickets -eq 1 -and [int64]$s2.completed_cycles -eq 1 -and [int64]$s2.pending_sync -eq 1 -and [int]$q2.count -eq 0 -and $wf2.state -eq 'IDLE'){$ready=$true;break}
              }catch{}
              Start-Sleep -Milliseconds 200
            }
            if(-not $ready){throw 'two-pass restart recovery failed'}
            Write-Host 'RESTART PASS: completed pair durable; physical workflow IDLE; no active queue replay'
          }finally{if($p2 -and -not $p2.HasExited){Stop-Process -Id $p2.Id -Force}}

      - name: W100 Modbus RTU two-pass acceptance
        shell: pwsh
        run: |
          $weightPath=Join-Path $PWD 'out/raw-weight-w100-ci.jsonl'
          $eventPath=Join-Path $PWD 'out/events-w100-ci.jsonl'
          $dbPath=Join-Path $PWD 'out/edge-w100-ci.db'
          Remove-Item $weightPath,$eventPath,$dbPath,"$dbPath-wal","$dbPath-shm" -ErrorAction SilentlyContinue
          $sim=Start-Process .\out\w100-sim.exe -PassThru
          Start-Sleep -Milliseconds 600
          $p=Start-Process .\out\plantops-edge-scale.exe -ArgumentList @(
            '-scale-driver','w100','-scale-port','tcp:127.0.0.1:19003','-scale-unit-id','1','-scale-poll','100ms','-scale-repeat-every','1s',
            '-listen','127.0.0.1:8082','-station-id','CI-W100-01','-raw-weight-journal',$weightPath,'-event-journal',$eventPath,'-db',$dbPath,
            '-vehicle-map','RFID-DEMO-001=15C-123.45','-empty-scale-max-kg','200','-min-stable-weight-kg','1000','-stable-confirmations','2','-stable-tolerance-kg','20',
            '-pair-max-elapsed','2h','-pair-min-net-kg','1000','-simulation'
          ) -PassThru
          $b='http://127.0.0.1:8082'
          $post={param($u,$j) Invoke-RestMethod "$b$u" -Method Post -ContentType 'application/json' -Body $j}
          try{
            $ready=$false
            for($i=0;$i -lt 40;$i++){
              try{$scale=Invoke-RestMethod "$b/api/scale/status" -TimeoutSec 1; if($scale.connected -and $scale.last_reading.stable -and [int64]$scale.last_reading.weight_kg -eq 0){$ready=$true;break}}catch{}
              Start-Sleep -Milliseconds 150
            }
            if(-not $ready){throw "W100 stable-zero proof failed: $($scale|ConvertTo-Json -Compress)"}

            & $post '/sim/position' '{"entry_present":true,"safety_clear":true}' | Out-Null
            & $post '/io/rfid' '{"tag":"RFID-DEMO-001","quality":99}' | Out-Null
            & $post '/io/lpr' '{"plate":"15C-123.45","confidence":98}' | Out-Null
            & $post '/sim/position' '{"front_present":true,"rear_present":true,"safety_clear":true}' | Out-Null
            $queued=$false
            for($i=0;$i -lt 80;$i++){
              $wf=Invoke-RestMethod "$b/api/workflow"
              if($wf.state -eq 'EXIT_AUTHORIZED' -and $wf.transaction.cycle_status -eq 'QUEUED'){$queued=$true;break}
              if($wf.state -eq 'FAULT_LOCKOUT'){throw "pass1 lockout: $($wf.transaction.last_block_reason)"}
              Start-Sleep -Milliseconds 150
            }
            if(-not $queued){throw "W100 pass1 not QUEUED: $($wf.state) $($wf.transaction.last_block_reason)"}
            if([int64]$wf.transaction.accepted_weight.weight_kg -ne 28460){throw 'W100 pass1 gross mismatch'}

            & $post '/sim/position' '{"exit_present":true,"safety_clear":true}' | Out-Null
            & $post '/sim/position' '{"safety_clear":true}' | Out-Null
            & $post '/sim/position' '{"safety_clear":true}' | Out-Null
            $queue=Invoke-RestMethod "$b/api/queue"
            $cycleId=[string]$queue.items[0].id
            Invoke-RestMethod "$b/api/queue/$cycleId/call" -Method Post | Out-Null
            $zero=$false
            for($i=0;$i -lt 60;$i++){
              $scale=Invoke-RestMethod "$b/api/scale/status"
              if($scale.last_reading.stable -and [int64]$scale.last_reading.weight_kg -eq 0){$zero=$true;break}
              Start-Sleep -Milliseconds 150
            }
            if(-not $zero){throw 'W100 second empty-deck proof missing'}

            & $post '/sim/position' '{"exit_present":true,"safety_clear":true}' | Out-Null
            & $post '/io/rfid' '{"tag":"RFID-DEMO-001","quality":99}' | Out-Null
            & $post '/io/lpr' '{"plate":"15C-123.45","confidence":98}' | Out-Null
            & $post '/sim/position' '{"front_present":true,"rear_present":true,"safety_clear":true}' | Out-Null
            $complete=$false
            for($i=0;$i -lt 90;$i++){
              $wf=Invoke-RestMethod "$b/api/workflow"
              if($wf.state -eq 'EXIT_AUTHORIZED' -and $wf.transaction.business_complete -and $wf.transaction.cycle_status -eq 'COMPLETE'){$complete=$true;break}
              if($wf.state -eq 'FAULT_LOCKOUT'){throw "pass2 lockout: $($wf.transaction.last_block_reason)"}
              Start-Sleep -Milliseconds 150
            }
            if(-not $complete){throw "W100 pair not COMPLETE: $($wf.state) $($wf.transaction.last_block_reason)"}
            if([int64]$wf.transaction.accepted_weight.weight_kg -ne 11820){throw 'W100 pass2 tare mismatch'}
            if(-not (Invoke-RestMethod "$b/api/audit/weights/verify").verified){throw 'W100 raw weight hash chain failed'}
            $w=Invoke-RestMethod "$b/api/audit/weights?limit=5"
            Write-Host ($w | ConvertTo-Json -Depth 5 -Compress).Substring(0,[Math]::Min(600,($w | ConvertTo-Json -Depth 5 -Compress).Length))
            Write-Host 'W100 TWO-PASS PASS: RTU 28460 gross -> QUEUED -> CALLED -> 11820 tare -> COMPLETE; raw chain verified'
          } finally {
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force}
            if($sim -and -not $sim.HasExited){Stop-Process -Id $sim.Id -Force}
          }

      - name: Bidirectional Modbus + two-pass hardware acceptance
        shell: pwsh
        run: |
          $weightPath=Join-Path $PWD 'out/raw-weight-hw-ci.jsonl'
          $eventPath=Join-Path $PWD 'out/events-hw-ci.jsonl'
          $dbPath=Join-Path $PWD 'out/edge-hw-ci.db'
          Remove-Item $weightPath,$eventPath,$dbPath,"$dbPath-wal","$dbPath-shm" -ErrorAction SilentlyContinue
          $scaleSim=Start-Process .\out\scale-sim.exe -PassThru
          $ioSim=Start-Process .\out\modbus-io-sim.exe -PassThru
          Start-Sleep -Milliseconds 700
          $p=Start-Process .\out\plantops-edge-scale.exe -ArgumentList @(
            '-scale-addr','127.0.0.1:19001','-io-addr','127.0.0.1:19002','-io-unit-id','1','-io-map','safety_clear=8','-io-poll','50ms','-io-buzzer-pulse','250ms','-barrier-feedback-timeout','2s',
            '-station-id','CI-HW-01','-raw-weight-journal',$weightPath,'-event-journal',$eventPath,'-db',$dbPath,
            '-vehicle-map','RFID-DEMO-001=15C-123.45','-empty-scale-max-kg','200','-min-stable-weight-kg','1000','-stable-confirmations','2','-stable-tolerance-kg','20','-pair-max-elapsed','2h'
          ) -PassThru
          try{
            $ready=$false
            for($i=0;$i -lt 80;$i++){
              try{$scale=Invoke-RestMethod http://127.0.0.1:8080/api/scale/status;$io=Invoke-RestMethod http://127.0.0.1:8080/api/io/status;$st=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status;if($scale.connected -and $io.connected -and $st.integrity -eq 'ok'){$ready=$true;break}}catch{}
              Start-Sleep -Milliseconds 150
            }
            if(-not $ready){throw 'scale+Modbus+SQLite not ready'}

            # First physical A->B approach comes from Modbus simulator.
            $pass1=$false
            for($i=0;$i -lt 60;$i++){$wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow;if($wf.transaction -and $wf.state -eq 'IDENTIFYING' -and $wf.transaction.direction -eq 'A_TO_B'){$pass1=$true;break};Start-Sleep -Milliseconds 150}
            if(-not $pass1){throw 'Modbus side-A approach did not create A->B pass'}
            Invoke-RestMethod http://127.0.0.1:8080/io/rfid -Method Post -ContentType 'application/json' -Body '{"tag":"RFID-DEMO-001","quality":99}'|Out-Null
            Invoke-RestMethod http://127.0.0.1:8080/io/lpr -Method Post -ContentType 'application/json' -Body '{"plate":"15C-123.45","confidence":98}'|Out-Null

            $queued=$false
            for($i=0;$i -lt 100;$i++){
              $q=Invoke-RestMethod http://127.0.0.1:8080/api/queue
              $st=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status
              if([int]$q.count -eq 1 -and $q.items[0].status -eq 'QUEUED' -and [int64]$st.tickets -eq 0){$queued=$true;break}
              Start-Sleep -Milliseconds 150
            }
            if(-not $queued){throw 'hardware first pass did not enter queue-only state'}
            $cycleId=[string]$q.items[0].id
            Invoke-RestMethod "http://127.0.0.1:8080/api/queue/$cycleId/call" -Method Post | Out-Null

            # Same truck returns from side B. Send identity only after that physical pass exists.
            $pass2=$false
            for($i=0;$i -lt 100;$i++){
              $wf=Invoke-RestMethod http://127.0.0.1:8080/api/workflow
              if($wf.transaction -and $wf.transaction.direction -eq 'B_TO_A' -and ($wf.state -eq 'IDENTIFYING' -or $wf.state -eq 'QUEUE_MISMATCH')){$pass2=$true;break}
              Start-Sleep -Milliseconds 150
            }
            if(-not $pass2){throw 'Modbus side-B return did not create B->A pass'}
            Invoke-RestMethod http://127.0.0.1:8080/io/rfid -Method Post -ContentType 'application/json' -Body '{"tag":"RFID-DEMO-001","quality":99}'|Out-Null
            Invoke-RestMethod http://127.0.0.1:8080/io/lpr -Method Post -ContentType 'application/json' -Body '{"plate":"15C-123.45","confidence":98}'|Out-Null

            $done=$false
            for($i=0;$i -lt 140;$i++){
              $st=Invoke-RestMethod http://127.0.0.1:8080/api/storage/status
              if([int64]$st.completed_cycles -eq 1 -and [int64]$st.tickets -eq 1 -and [int64]$st.pending_sync -eq 1 -and [int64]$st.queued_cycles -eq 0 -and [int64]$st.called_cycles -eq 0){$done=$true;break}
              Start-Sleep -Milliseconds 150
            }
            if(-not $done){throw 'bidirectional hardware pair did not complete durably'}

            $events=Invoke-RestMethod 'http://127.0.0.1:8080/api/audit/events?limit=1000'
            $commands=@($events.records|Where-Object{$_.event.kind -eq 'OUTPUT_COMMAND'})
            $sideAOpen=$commands|Where-Object{$_.event.action -eq 'ENTRY_BARRIER_OPEN_REQUEST' -and $_.event.data.value -eq $true}|Select-Object -First 1
            $sideBOpen=$commands|Where-Object{$_.event.action -eq 'EXIT_BARRIER_OPEN_REQUEST' -and $_.event.data.value -eq $true}|Select-Object -First 1
            if($null -eq $sideAOpen -or $null -eq $sideBOpen){throw 'both physical side A/B barrier intents were not audited'}
            if(-not (Invoke-RestMethod http://127.0.0.1:8080/api/audit/events/verify).verified){throw 'hardware event chain invalid'}

            # Wait until simulator has cleared the lane and reconciler removes every permissive output.
            $safe=$false
            for($i=0;$i -lt 50;$i++){$io=Invoke-RestMethod http://127.0.0.1:8080/api/io/status;if(-not $io.applied.entry_green -and -not $io.applied.exit_green -and -not $io.applied.entry_barrier_open -and -not $io.applied.exit_barrier_open -and -not $io.applied.buzzer){$safe=$true;break};Start-Sleep -Milliseconds 150}
            if(-not $safe){throw 'completed two-pass hardware cycle left permissive outputs'}
            Write-Host 'HARDWARE TWO-PASS PASS: A->B queue + B->A called pair + safe final outputs'
          }finally{
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force}
            if($scaleSim -and -not $scaleSim.HasExited){Stop-Process -Id $scaleSim.Id -Force}
            if($ioSim -and -not $ioSim.HasExited){Stop-Process -Id $ioSim.Id -Force}
          }

      - name: Hash
        shell: pwsh
        run: |
          (Get-FileHash out/plantops-edge-scale.exe -Algorithm SHA256).Hash.ToLower() | Set-Content out/plantops-edge-scale.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: plantops-edge-scale-go-${{ github.sha }}
          path: |
            out/plantops-edge-scale.exe
